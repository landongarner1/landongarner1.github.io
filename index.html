<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Wave Sketch</title>
  <!-- Load the p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <script>
    let offset = 0;
    let shapeTypes = {};

    function setup() {
      createCanvas(400, 400);
      fill(255, 72, 176);
        
      // 1 = rect, 2 = circle
      for (let i = 0; i <= 15; i++) {
        shapeTypes[i] = floor(random(1, 3));
      }
    }

    function draw() {
      background(30); // Clears the screen each frame so shapes animate smoothly
      
      if (frameCount % 95 === 0) {
        // Pick a new random shape layout every 95 frames
        for (let i = 0; i <= 15; i++) {
          shapeTypes[i] = floor(random(1, 3));
        }
      }

      for (let i = 0; i <= 15; i++) {
        let x = 50 + (i * 50);
        let y = 200 + sin(offset + i) * 50;
        
        if (shapeTypes[i] === 1) {
          rect(x, y, 15);
        } else {
          // Using x and y centers the circle on the wave path
          circle(x, y, 15); 
        }

        if (frameCount % 95 === 0) {
          circle(random(255), random(255), random(255));
          fill(255, 232, 0);
          rect(random(255), random(255), random(255));
          fill(0, 120, 191);
          ellipse(random(255), random(255), random(255));
          fill(255, 72, 176);
        }
      }

      offset += 0.1;
    }
  </script>
</body>
</html>
